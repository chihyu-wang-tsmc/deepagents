[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-jev"
description = "Jev (System One) decision middleware for deepagents: guardrails, routing, tool gating, verification, skills, RAG and memory"
license = { text = "MIT" }
readme = "README.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

version = "0.1.0"
requires-python = ">=3.11,<4.0"
keywords = ["deepagents", "langchain", "langgraph", "middleware", "jev", "typesafe", "system-one", "guardrails", "routing"]

dependencies = [
    "deepagents>=0.7.39,<0.8.0",
    "langchain>=1.5.0,<2.0.0",
    "langchain-core>=1.8.1,<2.0.0",
    "langgraph>=1.2.22,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_jev"]

[project.urls]
Homepage = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/jev"
Repository = "https://github.com/langchain-ai/deepagents"
Documentation = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/jev"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov",
    "pytest-socket",
    "pytest-xdist",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-watcher>=0.6.3,<1.0.0",
    "ruff>=0.15.20,<0.16.0",
    "ty>=0.0.54,<1.0.0",
]

[tool.uv.sources]
deepagents = { path = "../../deepagents", editable = true }

[tool.ty.environment]
extra-paths = ["../../deepagents"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
division-by-zero = "error"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "PLR0913",  # Too many arguments — middleware constructors legitimately expose many knobs
]
extend-safe-fixes = ["PLR6201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Unexpected warnings fail the run; see "Warnings are errors" in AGENTS.md.
    "error",
    # `langchain_core` imports `pydantic.v1` during collection on Python 3.14+.
    "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
    # `google.genai.types` builds a union alias out of `typing._UnionGenericAlias`
    # at import time, which Python 3.14 deprecates. It fires while `deepagents`
    # imports its default providers, before any of this package's code runs.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\\.genai\\.types",
]

[tool.ruff.lint.extend-per-file-ignores]
"examples/**/*.py" = [
    "D",  # Runnable scripts, not API: docstring rules do not apply
    "INP001",  # Standalone scripts, not a package
    "T201",  # Examples print what the agent and Jev decided
    "RUF001",  # Examples are written in Traditional Chinese for this fork's users,
    "RUF002",  # so strings, docstrings, and comments use full-width punctuation
    "RUF003",
]
"tests/**/*.py" = [
    "S101",
    "D",
    "ANN",
    "ARG",
    "PLR2004",
    "FBT",
    "INP001",
    "SLF001",
    "PLC0415",  # Inline imports inside test functions (for per-test isolation) are idiomatic
]
